<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivi des mailles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<!-- CORPS:DEBUT -->
<div class="page">
  <header class="top">
    <div>
      <h1>Suivi des mailles</h1>
      <p class="sub">Qualification des mailles par société : chaque maille part en « Nouveau » et doit être déclarée légitime ou non.</p>
    </div>
    <span id="demo" class="demo-badge" hidden>Données de démonstration, enregistrées dans ce navigateur
      <button id="reinit" class="btn" type="button">Réinitialiser</button>
    </span>
  </header>

  <section class="synthese" aria-label="Nombre de mailles par statut">
    <div class="synthese-tete">
      <strong>Répartition par statut</strong>
      <span id="total" class="total"></span>
    </div>
    <div class="barre" aria-hidden="true">
      <span class="nouveau"></span><span class="legitime"></span><span class="non_legitime"></span>
    </div>
    <div class="compteurs">
      <button type="button" class="compteur nouveau" data-statut="nouveau" aria-pressed="false" title="Filtrer sur ce statut">
        <span class="pastille"></span><span class="lib">Nouveau</span><span class="nb">–</span>
      </button>
      <button type="button" class="compteur legitime" data-statut="legitime" aria-pressed="false" title="Filtrer sur ce statut">
        <span class="pastille"></span><span class="lib">Légitime</span><span class="nb">–</span>
      </button>
      <button type="button" class="compteur non_legitime" data-statut="non_legitime" aria-pressed="false" title="Filtrer sur ce statut">
        <span class="pastille"></span><span class="lib">Non légitime</span><span class="nb">–</span>
      </button>
    </div>
  </section>

  <section class="liste" aria-label="Liste des mailles">
    <div class="liste-tete">
      <span id="affiches" class="affiches">Chargement…</span>
      <button id="effacer" class="btn" type="button" disabled>Effacer les filtres</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th scope="col">Société</th><th scope="col">SIREN</th><th scope="col">Maille</th><th scope="col" class="col-statut">Statut</th></tr>
          <tr class="filtres">
            <th><input id="f-societe" class="filtre" type="search" placeholder="Filtrer…" aria-label="Filtrer par société" autocomplete="off"></th>
            <th><input id="f-siren" class="filtre" type="search" placeholder="Filtrer…" aria-label="Filtrer par SIREN" inputmode="numeric" autocomplete="off"></th>
            <th><input id="f-maille" class="filtre" type="search" placeholder="Filtrer…" aria-label="Filtrer par maille" autocomplete="off"></th>
            <th>
              <select id="f-statut" class="filtre" aria-label="Filtrer par statut">
                <option value="">Tous</option>
                <option value="nouveau">Nouveau</option>
                <option value="legitime">Légitime</option>
                <option value="non_legitime">Non légitime</option>
              </select>
            </th>
          </tr>
        </thead>
        <tbody id="lignes"></tbody>
      </table>
    </div>
  </section>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<!-- CORPS:FIN -->
<script src="app.js"></script>
</body>
</html>
